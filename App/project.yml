# CalmFrame — XcodeGen spec (C1, 2026-11-15)
# 生成：cd App && xcodegen generate
# 输出：App/CalmFrame.xcodeproj（已提交，Xcode 可直接打开，无需额外工具）
# 部署目标 iOS 26（方案 v2 批复），bundle ID dev.calmframe.app。
# 校验：xcodebuild -list；再分别往 iPhone / iPad 模拟器构建（见 C1 验收）。
# C4/C5：CalmFrame/Frame/Paintings/ 下每 mood 1 张内置画打进 bundle。

name: CalmFrame
options:
  bundleIdPrefix: dev.calmframe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  CalmFrameKit:
    path: ../Packages/CalmFrameKit

targets:
  CalmFrame:
    type: application
    platform: iOS
    sources:
      - path: CalmFrame
    resources:
      - path: CalmFrame/Frame/Paintings
    bundleId: dev.calmframe.app
    info:
      path: CalmFrame/Info.plist
    dependencies:
      - package: CalmFrameKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.calmframe.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  CalmFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalmFrameTests
    bundleId: dev.calmframe.app.tests
    dependencies:
      - target: CalmFrame
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  CalmFrame:
    build:
      targets:
        CalmFrame: all
        CalmFrameTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalmFrameTests
